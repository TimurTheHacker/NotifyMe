<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminder Notifier</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    color: #f5f3ff;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    padding: 28px;
    backdrop-filter: blur(8px);
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { margin: 0 0 20px; opacity: 0.75; font-size: 0.95rem; }
  form { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.95rem; }
  .row button { margin-left: auto; }
  #secs { flex: 0 0 90px; width: 90px; text-align: center; }
  .pretty { opacity: 0.7; font-size: 0.85rem; }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    outline: none;
  }
  button {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #a78bfa;
    color: #1e1b4b;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #c4b5fd; }
  .ghost { margin-top: 10px; width: 100%; background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; font-size: 0.9rem; }
  .ghost:hover { background: rgba(255,255,255,0.25); }
  #status { margin: 14px 0 0; font-size: 0.85rem; opacity: 0.8; min-height: 1.2em; }
  ul { list-style: none; padding: 0; margin: 18px 0 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  li .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .time { font-variant-numeric: tabular-nums; font-weight: 700; color: #c4b5fd; }
  li button { padding: 4px 9px; font-size: 0.8rem; background: rgba(255,255,255,0.2); color: #fff; }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(150%);
    background: #fff;
    color: #1e1b4b;
    padding: 14px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.35s ease;
    max-width: 90vw;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="card">
    <h1>⏰ Reminder Notifier</h1>
    <p class="sub">Type something, pick a delay, and future you gets reminded.</p>

    <form id="form">
      <input id="text" type="text" placeholder="e.g. stop scrolling and drink water" maxlength="120" autocomplete="off" required>
      <div class="row">
        <label for="secs">Remind me in</label>
        <input id="secs" type="number" min="1" max="5400" step="1" value="30" required>
        <span>seconds</span>
        <span id="pretty" class="pretty"></span>
        <button type="submit">Send</button>
      </div>
    </form>

    <p id="status"></p>
    <button id="test" type="button" class="ghost">🔔 Send a test notification now</button>
    <ul id="list"></ul>
  </div>

  <div id="toast"></div>

<script>
  const MIN_SECS = 1;
  const MAX_SECS = 90 * 60; // 1h 30m cap

  const form = document.getElementById("form");
  const input = document.getElementById("text");
  const secsInput = document.getElementById("secs");
  const pretty = document.getElementById("pretty");
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const toast = document.getElementById("toast");

  const pending = new Map(); // id -> { text, dueAt, timeoutId, li }
  let nextId = 1;

  function updateStatus() {
    if (!("Notification" in window)) {
      status.textContent = "Your browser doesn't support notifications, so reminders will pop up on this page instead.";
    } else if (Notification.permission === "denied") {
      status.textContent = `Notifications are blocked for ${location.host}. Reminders will show on this page. (Click the icon left of the address bar → Notifications → Allow, then reload.)`;
    } else if (Notification.permission === "granted") {
      status.textContent = `Notifications on ✅ (for ${location.host})`;
    } else {
      status.textContent = "The browser will ask for permission the first time you hit Send.";
    }
  }

  // 75 -> "1m 15s", 5400 -> "1h 30m"
  function humanize(totalSecs) {
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = totalSecs % 60;
    const parts = [];
    if (h) parts.push(h + "h");
    if (m) parts.push(m + "m");
    if (s || parts.length === 0) parts.push(s + "s");
    return parts.join(" ");
  }

  // Countdown format: 45 -> "45s", 754 -> "12:34", 3725 -> "1:02:05"
  function clock(totalSecs) {
    if (totalSecs < 60) return totalSecs + "s";
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = String(totalSecs % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
  }

  function readSeconds() {
    const n = Math.floor(Number(secsInput.value));
    if (!Number.isFinite(n) || n < MIN_SECS || n > MAX_SECS) return null;
    return n;
  }

  function updatePretty() {
    const n = readSeconds();
    pretty.textContent = n === null
      ? `(pick 1–${MAX_SECS})`
      : n >= 60 ? `= ${humanize(n)}` : "";
  }
  secsInput.addEventListener("input", updatePretty);

  async function ensurePermission() {
    if (!("Notification" in window)) return false;
    if (Notification.permission === "default") {
      await Notification.requestPermission();
      updateStatus();
    }
    return Notification.permission === "granted";
  }

  function showToast(text) {
    toast.textContent = "🔔 " + text;
    toast.classList.add("show");
    clearTimeout(showToast.hideTimer);
    showToast.hideTimer = setTimeout(() => toast.classList.remove("show"), 5000);
  }

  // Shows a system notification. Returns an error message, or null if it worked.
  // Every notification gets a unique tag. Reusing a tag makes the browser silently
  // replace the old notification instead of popping up a new one.
  function notify(title, body) {
    const tag = "n-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    if (!("Notification" in window)) return "This browser doesn't support notifications.";
    if (Notification.permission !== "granted") {
      updateStatus();
      return `Notification permission is "${Notification.permission}" for ${location.host}.`;
    }
    try {
      const n = new Notification(title, { body, tag });
      n.onclick = () => { window.focus(); n.close(); };
      n.onerror = () => {
        status.textContent = "⚠️ The browser refused to show the notification.";
      };
      return null;
    } catch (err) {
      const msg = "⚠️ Notification failed: " + err.message;
      status.textContent = msg;
      console.error(err);
      return msg;
    }
  }

  document.getElementById("test").addEventListener("click", async () => {
    await ensurePermission();
    const problem = notify("🔔 Test notification", "If you can see this, notifications work!");
    showToast(problem || "Test sent. If no pop-up appeared, check Windows notification settings / Do Not Disturb.");
  });

  function fire(id) {
    const item = pending.get(id);
    if (!item) return;

    notify("⏰ Reminder", item.text);
    showToast(item.text); // also show on the page, in case the notification is hidden

    item.li.remove();
    pending.delete(id);
  }

  function cancel(id) {
    const item = pending.get(id);
    if (!item) return;
    clearTimeout(item.timeoutId);
    item.li.remove();
    pending.delete(id);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    const secs = readSeconds();
    if (secs === null) {
      showToast(`Pick a delay between ${MIN_SECS} second and ${humanize(MAX_SECS)}.`);
      secsInput.focus();
      return;
    }
    const delayMs = secs * 1000;

    await ensurePermission();

    const id = nextId++;
    const li = document.createElement("li");
    const msg = document.createElement("span");
    msg.className = "msg";
    msg.textContent = text;
    const time = document.createElement("span");
    time.className = "time";
    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "✕";
    cancelBtn.title = "Cancel";
    cancelBtn.addEventListener("click", () => cancel(id));

    li.append(msg, time, cancelBtn);
    list.prepend(li);

    pending.set(id, {
      text,
      dueAt: Date.now() + delayMs,
      timeoutId: setTimeout(() => fire(id), delayMs),
      li
    });

    input.value = "";
    input.focus();
    tick();
  });

  // Countdown display, based on real time so it stays accurate even if the tab is in the background
  function tick() {
    const now = Date.now();
    for (const [id, item] of pending) {
      if (now >= item.dueAt) { fire(id); continue; } // backup in case the timeout was delayed
      const secs = Math.max(0, Math.ceil((item.dueAt - now) / 1000));
      item.li.querySelector(".time").textContent = clock(secs);
    }
  }
  setInterval(tick, 250);

  updateStatus();
  updatePretty();
</script>
</body>
</html>
